[build-system]
requires=["setuptools>=75","wheel"]
build-backend="setuptools.build_meta"
[project]
name="deutschland-assistent-core"
version="0.1.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.9,<3","python-multipart>=0.0.12,<1","pypdf>=5,<7"]
[project.optional-dependencies]
docling=["docling>=2.70,<3"]
dev=["pytest>=8,<10","httpx>=0.27,<1"]
[tool.setuptools.packages.find]
where=["."]
include=["deutschland_assistent*"]
[tool.pytest.ini_options]
testpaths=["tests"]
