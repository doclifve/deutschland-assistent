services:
  civic-core:
    build:
      context: ./services/civic-core
      args:
        PREFETCH_DOCLING_MODELS: ${PREFETCH_DOCLING_MODELS:-0}
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DOCUMENT_ENGINE: ${DOCUMENT_ENGINE:-auto}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-15728640}
      MAX_DOCUMENT_PAGES: ${MAX_DOCUMENT_PAGES:-30}
      DOCUMENT_TTL_SECONDS: ${DOCUMENT_TTL_SECONDS:-3600}
      MAX_STORED_DOCUMENTS: ${MAX_STORED_DOCUMENTS:-500}
      DOCLING_ARTIFACTS_PATH: ${DOCLING_ARTIFACTS_PATH:-/opt/docling-models}
      NEURIS_BASE_URL: ${NEURIS_BASE_URL:-https://testphase.rechtsinformationen.bund.de}
      NEURIS_TIMEOUT_SECONDS: ${NEURIS_TIMEOUT_SECONDS:-8}
      NEURIS_CACHE_TTL_SECONDS: ${NEURIS_CACHE_TTL_SECONDS:-900}
      NEURIS_MAX_RETRIES: ${NEURIS_MAX_RETRIES:-2}
      NEURIS_ENRICH_CASE_LAW: ${NEURIS_ENRICH_CASE_LAW:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_REGION: ${LLM_REGION:-DE}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-900}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-true}
      ACTION_TTL_SECONDS: ${ACTION_TTL_SECONDS:-3600}
      MAX_AGENT_FORM_BYTES: ${MAX_AGENT_FORM_BYTES:-10485760}
      AGENT_EXECUTION_TOKEN: ${AGENT_EXECUTION_TOKEN:-}
      WHATSAPP_PUBLIC_NUMBER: ${WHATSAPP_PUBLIC_NUMBER:-}
      WHATSAPP_GREETING: ${WHATSAPP_GREETING:-Hallo}
    volumes:
      - docling_models:/opt/docling-models
    ports: ["8000:8000"]
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_CIVIC_API_URL: ${NEXT_PUBLIC_CIVIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_CIVIC_API_URL: ${NEXT_PUBLIC_CIVIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [civic-core]
  whatsapp-cloud:
    profiles: ["whatsapp"]
    build: ./channels/whatsapp-cloud
    environment:
      CIVIC_CORE_URL: http://civic-core:8000
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-change-me}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      APP_ENV: ${APP_ENV:-development}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v22.0}
      MAX_WHATSAPP_MEDIA_BYTES: ${MAX_WHATSAPP_MEDIA_BYTES:-15728640}
    ports: ["8010:8010"]
    depends_on: [civic-core]
volumes:
  docling_models:
